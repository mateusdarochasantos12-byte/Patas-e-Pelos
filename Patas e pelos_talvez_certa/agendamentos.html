<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - Patas & Pelos</title>
    <link rel="stylesheet" href="agendamentos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="img80.jpg" id="top" alt="Patas e Pelos">
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="Index.html">Home</a></li>
                <li><a href="condições.html">Novo Agendamento</a></li>
                <li><a href="login.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main class="container-agendamentos">
        <h1>Agendamentos Registrados</h1>

        <div id="mensagem-alerta"></div>

        <div class="tabela-wrapper" id="area-tabela" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Tutor</th>
                        <th>Telefone</th>
                        <th>Pet</th>
                        <th>Raça</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela"></tbody>
            </table>
        </div>

        <p class="vazio" id="msg-vazio" style="display: none;">Nenhum agendamento registrado no momento.</p>
    </main>

    <footer>
        <br>
        <h6>(31) 98378-5687</h6>
        <br>
        <h6>Av. A, 304 - Liberdade, Ribeirão das Neves - MG, 33822-700</h6>
        <br>
        <h6>Direitos reservados ©- v0.70.1</h6>
    </footer>

    <script>
        // Mostra alertas de sucesso ou remoção vindos pela URL
        const params = new URLSearchParams(window.location.search);
        const alerta = document.getElementById('mensagem-alerta');
        if (params.get('sucesso')) {
            alerta.innerHTML = '<div class="alerta sucesso">Agendamento confirmado com sucesso!</div>';
        } else if (params.get('removido')) {
            alerta.innerHTML = '<div class="alerta removido">Agendamento desfeito com sucesso.</div>';
        }

        // Busca os dados no agendamentos.php
        fetch('agendamentos.php')
            .then(res => res.json())
            .then(dados => {
                if (dados.erro === 'nao_logado') {
                    window.location.href = 'login.html';
                    return;
                }

                const lista = dados.agendamentos;
                if (lista.length > 0) {
                    document.getElementById('area-tabela').style.display = 'block';
                    const tbody = document.getElementById('corpo-tabela');

                    lista.forEach(item => {
                        const dataFormatada = item.data_desejada.split('-').reverse().join('/');
                        tbody.innerHTML += `
                            <tr>
                                <td>${item.nome_tutor}</td>
                                <td>${item.telefone}</td>
                                <td>${item.nome_pet}</td>
                                <td>${item.raca_pet}</td>
                                <td>${item.servico}</td>
                                <td>${dataFormatada}</td>
                                <td>
                                    <a href="agendamentos.php?excluir=${item.id}" 
                                       class="btn-desfazer" 
                                       onclick="return confirm('Deseja realmente desfazer este agendamento?');">
                                       Desfazer
                                    </a>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    document.getElementById('msg-vazio').style.display = 'block';
                }
            });
    </script>
</body>
</html>
