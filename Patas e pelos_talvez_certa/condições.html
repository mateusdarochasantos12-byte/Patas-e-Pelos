<main>
    <!-- INÍCIO: Seção do formulário de agendamento -->
    <section class="secao">
        <!-- INÍCIO: Título principal -->
        <h1> Agende para seu pet </h1>
        <!-- FIM: Título principal -->
        
        <!-- INÍCIO: Parágrafo descritivo -->
        <p> Preencha com o serviço desejado</p>
        <!-- FIM: Parágrafo descritivo -->

        <!-- INÍCIO: Formulário -->
        <form action="processar_agendamento.php" method="POST">

            <!-- INÍCIO: Grupo Nome do Tutor -->
            <div class="form-grupo">
                <label for="name">Seu nome</label>
                <input type="text"  id="responsavel" name="nome-tutor" placeholder="insira seu nome">
            </div>
            <!-- FIM: Grupo Nome do Tutor -->

            <!-- INÍCIO: Grupo Telefone -->
            <div class="form-grupo">
                <label for="tefone-responsavel">Seu telefone</label>
                <input type="number" id="tel" name="telefone-responsavel" placeholder="Insira seu telefone" required>
            </div>
            <!-- FIM: Grupo Telefone -->

            <!-- INÍCIO: Grupo Nome do Pet -->
            <div class="form-grupo">
                <label for="nome-pet">Nome do pet</label>
                <input type="text" id="name_pet" name="nome-pet" placeholder="Nome do seu pet" required>
            </div>
            <!-- FIM: Grupo Nome do Pet -->

            <!-- INÍCIO: Grupo Raça do Pet -->
            <div class="form-grupo">
                <label for="raca">Raça do pet</label>
                <select id="raca" name="raca_pet" required>
                    <option value="">Selecione a raça</option>
                    <option value="SRD / Vira-lata">SRD / Vira-lata</option>
                    <option value="Shih-tzu">Shih-tzu</option>
                    <option value="Poodle">Poodle</option>
                    <option value="Golden Retriever">Golden Retriever</option>
                    <option value="Labrador">Labrador</option>
                    <option value="Bulldog">Bulldog</option>
                    <option value="Yorkshire">Yorkshire</option>
                    <option value="Pastor Alemão">Pastor Alemão</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>
            <!-- FIM: Grupo Raça do Pet -->
             
            <!-- INÍCIO: Grupo Seleção de Serviço -->
            <div class="form-grupo">
                <label for="serviço">Escolha o serviço</label>
                <select id="serviço" name="serviço">
                    <option value="">Selecione o serviço</option>
                    <option value="banho e Tosa">Banho e Tosa   $390,90</option>
                    <option value="Consultas e Exames ">Consultas e Exames  $1.400,00</option>
                    <option value="Adestramento">Adestramento  $5.290,50</option>
                </select>
            </div>
            <!-- FIM: Grupo Seleção de Serviço -->

            <!-- INÍCIO: Grupo Data Desejada -->
            <div>
                <label for="Data">Data desejada</label>
                <input type="date" id="Data" name="data-desejada" required>
            </div>
            <!-- FIM: Grupo Data Desejada -->
            <br>
            
            <!-- INÍCIO: Botão de Confirmação -->
            <div>
                <button type="submit" id="Confirmar">Confirmar Agendamento</button>
            </div>
            <!-- FIM: Botão de Confirmação -->

        </form>
        <!-- FIM: Formulário -->

    </section>
    <!-- FIM: Seção do formulário de agendamento -->
</main>
<!-- FIM: Main -->
